<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>My Blog · 持久化</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ----- 样式与之前一致，为节省篇幅省略，但实际代码中会包含所有样式 ----- */
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto; }
        body { background:#f5f6f8; color:#333; transition: margin-right 0.25s; }
        .header { height:360px; background-image:url("images/header-bg.jpg"); background-size:cover; background-position:center; position:relative; }
        .header::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,0.35); }
        .profile { position:relative; margin-top:-80px; text-align:center; z-index:10; }
        .avatar { width:120px; height:120px; border-radius:50%; border:5px solid #fff; object-fit:cover; box-shadow:0 10px 25px rgba(0,0,0,0.2); display:inline-block; }
        .name { font-size:20px; font-weight:600; margin-top:10px; color:#222; }
        .toolbar { max-width:900px; margin:20px auto 0; padding:0 20px; }
        .toolbar input { width:100%; padding:12px 16px; border-radius:12px; border:none; box-shadow:0 4px 18px rgba(0,0,0,0.08); font-size:15px; outline:none; background:#fff; }
        .container { max-width:900px; margin:20px auto 80px; padding:0 20px; }
        .post { background:#fff; padding:14px 18px; border-radius:14px; margin-bottom:14px; box-shadow:0 6px 20px rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.15s, box-shadow 0.15s; display:flex; justify-content:space-between; align-items:center; }
        .post:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,0.10); }
        .post-left { flex:1; min-width:0; }
        .post-left h3 { font-size:17px; margin-bottom:2px; color:#1a1a1a; }
        .post-left .bio { font-size:13px; color:#777; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .post-left .date { font-size:12px; color:#999; margin-right:6px; }
        .post-left .note-preview { font-size:13px; color:#888; font-style:italic; background:#f4f4f6; padding:2px 10px; border-radius:20px; display:inline-block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; margin-top:3px; }
        .post-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:12px; }
        .post-delete { background:none; border:none; color:#ccc; font-size:16px; cursor:pointer; padding:2px 6px; border-radius:8px; transition:all 0.2s; line-height:1.4; }
        .post-delete:hover { color:#e74c3c; background:#fee8e8; }
        .post-note-btn { background:none; border:none; font-size:16px; cursor:pointer; padding:2px 6px; border-radius:8px; transition:all 0.2s; line-height:1.4; color:#ccc; }
        .post-note-btn.has-note { color:#2d7aff; }
        .post-note-btn.has-note:hover { background:#eaf1ff; }
        .post-note-btn.no-note:hover { background:#f0f0f0; }
        .fab { position:fixed; right:24px; bottom:24px; width:56px; height:56px; border-radius:50%; background:#111; color:#fff; font-size:30px; border:none; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,0.25); transition:transform 0.2s; z-index:100; }
        .fab:hover { transform:scale(1.06); }
        .editor { display:none; position:fixed; inset:0; background:#fff; z-index:999; flex-direction:column; }
        .editor-top { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid #eee; flex-shrink:0; }
        .publish-btn { background:#fde68a; border:none; padding:8px 18px; border-radius:8px; cursor:pointer; color:#111; font-weight:600; font-size:15px; transition:background 0.2s; }
        .publish-btn:hover { background:#fcd34d; }
        .exit { background:none; border:none; font-size:26px; color:#999; cursor:pointer; padding:0 4px; }
        .exit:hover { color:#333; }
        .editor input, .editor textarea { width:100%; border:none; outline:none; padding:14px 18px; font-size:16px; background:#fafafa; }
        .editor input { border-bottom:1px solid #eee; background:#fff; }
        .editor textarea { flex:1; resize:none; background:#fff; line-height:1.7; }
        .upload { padding:10px 18px; border-top:1px solid #eee; background:#fafafa; flex-shrink:0; }
        .upload input[type="file"] { font-size:14px; }
        .reader { display:none; position:fixed; inset:0; background:#fff; z-index:1000; overflow:auto; padding-bottom:60px; }
        .reader-exit { position:fixed; top:14px; left:14px; background:none; border:none; font-size:26px; color:#999; cursor:pointer; z-index:10; padding:4px 8px; border-radius:8px; }
        .reader-exit:hover { color:#333; background:#f0f0f0; }
        .reader-add-note { position:fixed; bottom:30px; right:30px; background:#111; color:#fff; border:none; border-radius:40px; padding:12px 20px; font-size:15px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.2); z-index:20; transition:transform 0.2s; }
        .reader-add-note:hover { transform:scale(1.04); }
        .reader-content { max-width:700px; margin:80px auto 20px; padding:20px 24px 40px; }
        .reader-title { font-size:28px; font-weight:bold; line-height:1.3; margin-bottom:10px; }
        .reader-title .note-highlight { background:#fff3b0; border-radius:4px; padding:0 2px; cursor:pointer; transition:background 0.2s; }
        .reader-title .note-highlight:hover { background:#ffe066; }
        .reader-date { font-size:13px; color:#999; margin-top:8px; }
        .reader-media { display:flex; overflow-x:auto; gap:12px; padding:12px 0 16px 0; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
        .reader-media.single { overflow-x:hidden; justify-content:center; }
        .reader-media img, .reader-media video { flex:0 0 auto; max-height:300px; width:auto; border-radius:10px; scroll-snap-align:start; cursor:zoom-in; transition:transform 0.15s; }
        .reader-media img:hover, .reader-media video:hover { transform:scale(1.02); }
        .reader-text { margin-top:10px; line-height:1.8; font-size:16px; white-space:pre-wrap; word-break:break-word; }
        .reader-text .note-highlight { background:#fff3b0; border-radius:4px; padding:0 2px; cursor:pointer; transition:background 0.2s; }
        .reader-text .note-highlight:hover { background:#ffe066; }
        .image-zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:3000; justify-content:center; align-items:center; cursor:pointer; }
        .image-zoom img { max-width:90%; max-height:90%; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,0.5); object-fit:contain; cursor:default; }
        .note-panel { position:fixed; top:0; right:-380px; width:360px; height:100%; background:#fff; box-shadow:-4px 0 30px rgba(0,0,0,0.1); z-index:2000; transition:right 0.3s ease; overflow-y:auto; padding:30px 24px; border-left:1px solid #eee; }
        .note-panel.open { right:0; }
        .note-panel .panel-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; cursor:pointer; color:#999; }
        .note-panel .panel-close:hover { color:#333; }
        .note-panel .panel-original { color:#888; font-size:15px; line-height:1.6; background:#f8f8fa; padding:12px 16px; border-radius:10px; margin-bottom:16px; border-left:4px solid #ddd; }
        .note-panel .panel-note { color:#1a1a1a; font-size:17px; line-height:1.7; padding:12px 16px; background:#f0f4ff; border-radius:10px; border-left:4px solid #2d7aff; }
        .note-panel .panel-label { font-size:13px; font-weight:600; color:#666; margin-bottom:6px; }
        .empty { text-align:center; color:#bbb; padding:60px 20px; font-size:16px; }
        .data-actions { max-width:900px; margin:10px auto 40px; padding:0 20px; display:flex; gap:12px; justify-content:flex-end; }
        .data-actions button { background:#fff; border:1px solid #ddd; padding:6px 16px; border-radius:20px; cursor:pointer; font-size:14px; transition:all 0.2s; }
        .data-actions button:hover { background:#f0f0f0; }
        @media (max-width:600px) { .header { height:220px; } .profile { margin-top:-56px; } .avatar { width:88px; height:88px; } .name { font-size:17px; } .reader-content { padding:16px 18px 30px; margin-top:60px; } .reader-title { font-size:22px; } .post { padding:12px 14px; flex-wrap:wrap; } .post-left { flex:1 1 100%; margin-bottom:6px; } .post-actions { margin-left:0; justify-content:flex-end; width:100%; } .fab { right:16px; bottom:16px; width:50px; height:50px; font-size:26px; } .note-panel { width:100%; right:-100%; } .reader-add-note { right:16px; bottom:16px; padding:10px 16px; font-size:14px; } .reader-media img, .reader-media video { max-height:200px; } }
    </style>
</head>
<body>

    <div class="header"></div>

    <div class="profile">
        <img src="images/avatar.jpg" class="avatar" alt="avatar">
        <div class="name">安宁</div>
    </div>

    <div class="toolbar">
        <input placeholder="搜索文章..." oninput="search(this.value)">
    </div>

    <div class="container" id="list"></div>

    <!-- 导入/导出按钮 -->
    <div class="data-actions">
        <button onclick="exportData()">📤 导出数据</button>
        <button onclick="document.getElementById('importInput').click()">📥 导入数据</button>
        <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
    </div>

    <button class="fab" onclick="openEditor()">＋</button>

    <!-- 编辑器 -->
    <div class="editor" id="editor">
        <div class="editor-top">
            <button class="exit" onclick="closeEditor()">×</button>
            <button class="publish-btn" onclick="publish()">发布</button>
        </div>
        <input id="title" placeholder="标题">
        <input id="bio" placeholder="简介">
        <textarea id="content" placeholder="正文内容..."></textarea>
        <div class="upload">
            <input type="file" multiple accept="image/*,video/*" onchange="handleFiles(event)">
        </div>
    </div>

    <!-- 阅读页 -->
    <div class="reader" id="reader">
        <button class="reader-exit" onclick="closeReader()">×</button>
        <button class="reader-add-note" onclick="addNoteFromSelection()">✏️ 添加批注</button>
        <div class="reader-content">
            <div class="reader-title" id="rTitle"></div>
            <div class="reader-date" id="rDate"></div>
            <div class="reader-media" id="rMedia"></div>
            <div class="reader-text" id="rText"></div>
        </div>
    </div>

    <!-- 批注面板 -->
    <div class="note-panel" id="notePanel">
        <button class="panel-close" onclick="closeNotePanel()">×</button>
        <div id="panelContent">
            <div class="panel-label">📄 原文</div>
            <div class="panel-original" id="panelOriginal"></div>
            <div class="panel-label" style="margin-top:18px;">✏️ 批注</div>
            <div class="panel-note" id="panelNote"></div>
        </div>
    </div>

    <!-- 图片放大 -->
    <div class="image-zoom" id="imageZoom" onclick="closeZoom()">
        <img id="zoomImg" src="" alt="放大图片">
    </div>

    <script>
        // ============================================================
        //  1. IndexedDB 辅助函数（存储/读取 Blob）
        // ============================================================
        const DB_NAME = 'BlogMediaDB';
        const STORE_NAME = 'media';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // 存储文件（返回 id）
        async function storeMediaFile(file) {
            const db = await openDB();
            const id = Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const record = { id, blob: file, type: file.type, name: file.name };
                const req = store.put(record);
                req.onsuccess = () => resolve(id);
                req.onerror = () => reject(req.error);
            });
        }

        // 根据 id 读取 Blob
        async function getMediaBlob(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                req.onerror = () => reject(req.error);
            });
        }

        // 删除媒体（用于删除文章时清理）
        async function deleteMediaFile(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // 获取所有媒体记录（用于导出）
        async function getAllMediaRecords() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // 批量导入（清空后重新填充）
        async function importAllMedia(records) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                // 清空
                store.clear();
                records.forEach(rec => {
                    store.put(rec);
                });
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        // ============================================================
        //  2. 数据层（posts + 媒体ID）
        // ============================================================
        let posts = JSON.parse(localStorage.getItem("posts")) || [];

        posts = posts.map(p => {
            if (!p.id) p.id = Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            if (!p.notes) p.notes = [];
            // 确保 media 是数组，每个元素为 { id, type } (type: 'img' | 'video')
            if (!p.media) p.media = [];
            return p;
        });
        localStorage.setItem("posts", JSON.stringify(posts));

        let currentId = null;
        let uploaded = []; // 暂存上传的 { id, type }

        // ============================================================
        //  3. 渲染列表
        // ============================================================
        function render(list) {
            const el = document.getElementById("list");
            const data = list || posts;

            if (data.length === 0) {
                el.innerHTML = `<div class="empty">📭 还没有文章，点击右下角「＋」发布</div>`;
                return;
            }

            el.innerHTML = "";
            data.forEach(p => {
                const div = document.createElement("div");
                div.className = "post";

                const left = document.createElement("div");
                left.className = "post-left";

                const titleDiv = document.createElement("h3");
                titleDiv.textContent = p.title;
                left.appendChild(titleDiv);

                if (p.bio) {
                    const bioDiv = document.createElement("div");
                    bioDiv.className = "bio";
                    bioDiv.textContent = p.bio;
                    left.appendChild(bioDiv);
                }

                const metaDiv = document.createElement("div");
                metaDiv.style.display = "flex";
                metaDiv.style.alignItems = "center";
                metaDiv.style.flexWrap = "wrap";
                metaDiv.style.gap = "4px 8px";

                const dateSpan = document.createElement("span");
                dateSpan.className = "date";
                dateSpan.textContent = p.date;
                metaDiv.appendChild(dateSpan);

                if (p.notes && p.notes.length > 0) {
                    const preview = document.createElement("span");
                    preview.className = "note-preview";
                    const firstNote = p.notes[0];
                    const snippet = firstNote.originalText.length > 20 ? firstNote.originalText.slice(0, 20) + '…' : firstNote.originalText;
                    preview.textContent = '💬 ' + snippet;
                    metaDiv.appendChild(preview);
                }

                left.appendChild(metaDiv);
                div.appendChild(left);

                const actions = document.createElement("div");
                actions.className = "post-actions";

                const noteBtn = document.createElement("button");
                noteBtn.className = "post-note-btn";
                noteBtn.innerHTML = "✏️";
                noteBtn.setAttribute("aria-label", "批注状态");
                if (p.notes && p.notes.length > 0) {
                    noteBtn.classList.add("has-note");
                } else {
                    noteBtn.classList.add("no-note");
                }
                noteBtn.onclick = function(e) {
                    e.stopPropagation();
                    openPost(p.id);
                };
                actions.appendChild(noteBtn);

                const delBtn = document.createElement("button");
                delBtn.className = "post-delete";
                delBtn.innerHTML = "✕";
                delBtn.setAttribute("aria-label", "删除文章");
                delBtn.onclick = function(e) {
                    e.stopPropagation();
                    deletePost(p.id);
                };
                actions.appendChild(delBtn);

                div.appendChild(actions);

                div.onclick = function() {
                    openPost(p.id);
                };

                el.appendChild(div);
            });
        }

        // ============================================================
        //  4. 删除文章（同时删除媒体文件）
        // ============================================================
        async function deletePost(id) {
            if (!confirm("确定要删除这篇文章吗？删除后无法恢复。")) return;
            const index = posts.findIndex(p => p.id === id);
            if (index === -1) return;
            const post = posts[index];
            // 删除所有关联媒体
            if (post.media) {
                for (let m of post.media) {
                    await deleteMediaFile(m.id);
                }
            }
            posts.splice(index, 1);
            localStorage.setItem("posts", JSON.stringify(posts));
            if (currentId === id) {
                closeReader();
                currentId = null;
            }
            render();
        }

        // ============================================================
        //  5. 打开阅读页（从IndexedDB读取媒体）
        // ============================================================
        async function openPost(id) {
            const p = posts.find(item => item.id === id);
            if (!p) {
                alert("文章不存在");
                return;
            }
            currentId = id;

            const titleEl = document.getElementById("rTitle");
            const dateEl = document.getElementById("rDate");
            const textEl = document.getElementById("rText");
            const mediaEl = document.getElementById("rMedia");

            dateEl.textContent = p.date;

            const notes = p.notes || [];
            const highlightText = (text, notes) => {
                if (!notes || notes.length === 0) return text;
                const sorted = [...notes].sort((a, b) => b.originalText.length - a.originalText.length);
                let result = text;
                sorted.forEach(n => {
                    const escaped = n.originalText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escaped, 'g');
                    result = result.replace(regex, match => {
                        return `<span class="note-highlight" data-note-id="${n.id}" data-original="${encodeURIComponent(match)}">${match}</span>`;
                    });
                });
                return result;
            };

            const titleHTML = highlightText(p.title, notes);
            const contentHTML = highlightText(p.content, notes);

            titleEl.innerHTML = titleHTML;
            textEl.innerHTML = contentHTML;

            // 绑定高亮点击
            const readerContent = document.querySelector('.reader-content');
            readerContent.querySelectorAll('.note-highlight').forEach(el => {
                el.removeEventListener('click', handleHighlightClick);
                el.addEventListener('click', handleHighlightClick);
            });

            // ----- 媒体区域 -----
            mediaEl.innerHTML = "";
            if (p.media && p.media.length > 0) {
                for (let m of p.media) {
                    const blob = await getMediaBlob(m.id);
                    if (!blob) continue;
                    const url = URL.createObjectURL(blob);
                    if (m.type === 'img') {
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = '图片';
                        img.loading = 'lazy';
                        img.onclick = function(e) {
                            e.stopPropagation();
                            openZoom(this.src);
                        };
                        mediaEl.appendChild(img);
                    } else if (m.type === 'video') {
                        const video = document.createElement('video');
                        video.src = url;
                        video.controls = true;
                        video.style.maxHeight = '300px';
                        video.style.borderRadius = '10px';
                        video.style.flex = '0 0 auto';
                        mediaEl.appendChild(video);
                    }
                }

                // 单张图片居中
                const items = mediaEl.children;
                if (items.length === 1 && items[0].tagName === 'IMG') {
                    mediaEl.classList.add('single');
                } else {
                    mediaEl.classList.remove('single');
                }
            } else {
                mediaEl.classList.remove('single');
            }

            document.getElementById("reader").style.display = "block";
            document.body.style.overflow = "hidden";
            closeNotePanel();
        }

        // ============================================================
        //  6. 批注相关（与之前相同）
        // ============================================================
        function handleHighlightClick(e) {
            const el = e.currentTarget;
            const noteId = el.dataset.noteId;
            const original = decodeURIComponent(el.dataset.original || '');
            const post = posts.find(p => p.id === currentId);
            if (!post) return;
            const note = post.notes.find(n => n.id === noteId);
            if (note) {
                showNotePanel(note);
            } else {
                const found = post.notes.find(n => n.originalText === original);
                if (found) showNotePanel(found);
                else alert('批注数据异常');
            }
        }

        function showNotePanel(note) {
            document.getElementById("panelOriginal").textContent = note.originalText;
            document.getElementById("panelNote").textContent = note.noteText;
            document.getElementById("notePanel").classList.add("open");
        }

        function closeNotePanel() {
            document.getElementById("notePanel").classList.remove("open");
        }

        async function addNoteFromSelection() {
            if (!currentId) { alert("请先打开一篇文章"); return; }
            const post = posts.find(p => p.id === currentId);
            if (!post) { alert("文章不存在"); return; }

            const sel = window.getSelection();
            const selectedText = sel.toString().trim();
            if (!selectedText) { alert("请先在文章中选中一段文本（标题或正文）"); return; }

            const readerEl = document.getElementById("reader");
            if (!readerEl.contains(sel.anchorNode)) { alert("请选中文章内容中的文本"); return; }

            const noteText = prompt("请输入批注内容：");
            if (noteText === null) return;
            const trimmedNote = noteText.trim();
            if (!trimmedNote) { alert("批注内容不能为空"); return; }

            const note = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                originalText: selectedText,
                noteText: trimmedNote
            };
            post.notes.push(note);
            localStorage.setItem("posts", JSON.stringify(posts));

            openPost(currentId);
            setTimeout(() => {
                const highlights = document.querySelectorAll('.note-highlight');
                for (let el of highlights) {
                    if (el.dataset.noteId === note.id) {
                        el.scrollIntoView({ block: 'center' });
                        handleHighlightClick({ currentTarget: el });
                        break;
                    }
                }
                render();
            }, 50);
        }

        // ============================================================
        //  7. 发布文章（处理媒体上传）
        // ============================================================
        async function publish() {
            const titleVal = document.getElementById("title").value.trim();
            const bioVal = document.getElementById("bio").value.trim();
            const contentVal = document.getElementById("content").value.trim();
            if (!titleVal) { alert("请填写标题"); return; }

            // 上传的媒体列表（含ID和类型）
            const mediaList = uploaded; // 每个元素 { id, type }

            const newPost = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                title: titleVal,
                bio: bioVal || "暂无简介",
                content: contentVal || "（空内容）",
                media: mediaList,
                date: new Date().toISOString().slice(0, 10),
                notes: []
            };
            posts.unshift(newPost);
            localStorage.setItem("posts", JSON.stringify(posts));

            // 清空编辑器
            document.getElementById("title").value = "";
            document.getElementById("bio").value = "";
            document.getElementById("content").value = "";
            uploaded = [];
            document.querySelector(".upload input[type=file]").value = "";
            closeEditor();
            render();
        }

        // 文件上传处理：存入IndexedDB，并记录id
        async function handleFiles(e) {
            const files = [...e.target.files];
            for (let file of files) {
                const id = await storeMediaFile(file);
                const type = file.type.startsWith("image") ? "img" : "video";
                uploaded.push({ id, type });
            }
            // 显示反馈
            alert(`已上传 ${files.length} 个文件，发布后即可显示。`);
        }

        // ============================================================
        //  8. 图片放大
        // ============================================================
        function openZoom(src) {
            document.getElementById('zoomImg').src = src;
            document.getElementById('imageZoom').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeZoom() {
            document.getElementById('imageZoom').style.display = 'none';
            document.body.style.overflow = '';
        }

        // ============================================================
        //  9. 搜索
        // ============================================================
        function search(keyword) {
            const k = keyword.trim().toLowerCase();
            if (!k) { render(posts); return; }
            const filtered = posts.filter(p =>
                p.title.toLowerCase().includes(k) ||
                p.content.toLowerCase().includes(k) ||
                (p.bio && p.bio.toLowerCase().includes(k)) ||
                (p.notes && p.notes.some(n => n.originalText.toLowerCase().includes(k) || n.noteText.toLowerCase().includes(k)))
            );
            render(filtered);
        }

        // ============================================================
        //  10. 导出 / 导入数据（含媒体）
        // ============================================================
        async function exportData() {
            // 获取所有媒体记录
            const mediaRecords = await getAllMediaRecords();
            // 将 blob 转换为 base64 以便 JSON 序列化
            const mediaData = [];
            for (let rec of mediaRecords) {
                const blob = rec.blob;
                const reader = new FileReader();
                const base64 = await new Promise((resolve) => {
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                });
                mediaData.push({
                    id: rec.id,
                    type: rec.type,
                    name: rec.name,
                    base64: base64
                });
            }
            const exportObj = {
                posts: posts,
                media: mediaData,
                version: '1.0'
            };
            const json = JSON.stringify(exportObj);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'blog_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        async function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (!data.posts || !data.media) {
                        alert('无效的数据文件');
                        return;
                    }
                    if (!confirm('导入将覆盖当前所有数据，确认继续？')) return;

                    // 清空当前 IndexedDB
                    const db = await openDB();
                    await new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.clear();
                        tx.oncomplete = resolve;
                        tx.onerror = reject;
                    });

                    // 导入媒体：从 base64 还原为 Blob
                    const newRecords = [];
                    for (let item of data.media) {
                        const response = await fetch(item.base64);
                        const blob = await response.blob();
                        newRecords.push({
                            id: item.id,
                            blob: blob,
                            type: item.type,
                            name: item.name || 'file'
                        });
                    }
                    await importAllMedia(newRecords);

                    // 更新 posts
                    posts = data.posts;
                    localStorage.setItem("posts", JSON.stringify(posts));
                    render();
                    alert('导入成功！');
                } catch (err) {
                    alert('导入失败：' + err.message);
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // 重置input
        }

        // ============================================================
        //  11. UI 控制
        // ============================================================
        function openEditor() {
            document.getElementById("editor").style.display = "flex";
            document.body.style.overflow = "hidden";
        }
        function closeEditor() {
            document.getElementById("editor").style.display = "none";
            document.body.style.overflow = "";
        }
        function closeReader() {
            document.getElementById("reader").style.display = "none";
            document.body.style.overflow = "";
            currentId = null;
            closeNotePanel();
            closeZoom();
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                if (document.getElementById("imageZoom").style.display === "flex") {
                    closeZoom();
                } else if (document.getElementById("reader").style.display === "block") {
                    closeReader();
                } else if (document.getElementById("editor").style.display === "flex") {
                    closeEditor();
                } else if (document.getElementById("notePanel").classList.contains("open")) {
                    closeNotePanel();
                }
            }
        });

        // ============================================================
        //  12. 初始化
        // ============================================================
        render();

        console.log('🎉 博客已启动！媒体文件使用IndexedDB持久化存储，刷新不丢失。');
        console.log('📤 使用“导出数据”备份，📥 使用“导入数据”恢复/分享。');
    </script>
