<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>My Blog · 批注增强</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        body {
            background: #f5f6f8;
            color: #333;
        }

        /* ===== 背景 ===== */
        .header {
            height: 360px;
            background-image: url("images/header-bg.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .header::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        /* ===== 头像 ===== */
        .profile {
            position: relative;
            margin-top: -80px;
            text-align: center;
            z-index: 10;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #fff;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }

        .name {
            font-size: 20px;
            font-weight: 600;
            margin-top: 10px;
            color: #222;
        }

        /* ===== 搜索 ===== */
        .toolbar {
            max-width: 900px;
            margin: 20px auto 0;
            padding: 0 20px;
        }

        .toolbar input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        /* ===== 列表 ===== */
        .container {
            max-width: 900px;
            margin: 20px auto 80px;
            padding: 0 20px;
        }

        .post {
            background: #fff;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.10);
        }

        .post-left {
            flex: 1;
            min-width: 0;
        }
        .post-left h3 {
            font-size: 17px;
            margin-bottom: 2px;
            color: #1a1a1a;
        }
        .post-left .date {
            font-size: 12px;
            color: #999;
        }
        /* 不再显示批注文本标签 */

        /* 右侧按钮组 */
        .post-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 12px;
        }

        /* ===== 缩小后的删除按钮 ===== */
        .post-delete {
            background: none;
            border: none;
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            transition: all 0.2s;
            line-height: 1.4;
        }
        .post-delete:hover {
            color: #e74c3c;
            background: #fee8e8;
        }

        /* ===== 批注按钮（根据批注变色） ===== */
        .post-note-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            transition: all 0.2s;
            line-height: 1.4;
            color: #bbb; /* 默认灰色 */
        }
        .post-note-btn.has-note {
            color: #2d7aff; /* 有批注变为蓝色 */
        }
        .post-note-btn:hover {
            background: #eaf1ff;
        }

        /* ===== + 按钮 ===== */
        .fab {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #111;
            color: #fff;
            font-size: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s;
            z-index: 100;
        }
        .fab:hover {
            transform: scale(1.06);
        }

        /* ======================
           ✍️ 编辑器
        ====================== */
        .editor {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 999;
            flex-direction: column;
        }

        .editor-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .publish-btn {
            background: #fde68a;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            color: #111;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }
        .publish-btn:hover {
            background: #fcd34d;
        }

        .exit {
            background: none;
            border: none;
            font-size: 26px;
            color: #999;
            cursor: pointer;
            padding: 0 4px;
        }
        .exit:hover {
            color: #333;
        }

        .editor input,
        .editor textarea {
            width: 100%;
            border: none;
            outline: none;
            padding: 14px 18px;
            font-size: 16px;
            background: #fafafa;
        }
        .editor input {
            border-bottom: 1px solid #eee;
            background: #fff;
        }
        .editor textarea {
            flex: 1;
            resize: none;
            background: #fff;
            line-height: 1.7;
        }

        .upload {
            padding: 10px 18px;
            border-top: 1px solid #eee;
            background: #fafafa;
            flex-shrink: 0;
        }
        .upload input[type="file"] {
            font-size: 14px;
        }

        /* ========================================
           阅读页 + 批注面板
        ======================================== */
        .reader {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 1000;
            overflow: hidden;
            flex-direction: row;
        }

        /* 左侧主内容 */
        .reader-main {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px 60px;
            background: #fff;
        }

        .reader-exit {
            position: sticky;
            top: 14px;
            left: 0;
            background: none;
            border: none;
            font-size: 26px;
            color: #999;
            cursor: pointer;
            z-index: 10;
            padding: 4px 8px;
            border-radius: 8px;
            float: left;
        }
        .reader-exit:hover {
            color: #333;
            background: #f0f0f0;
        }

        .reader-title {
            font-size: 28px;
            font-weight: bold;
            line-height: 1.3;
            margin-top: 10px;
            clear: both;
            padding: 4px 0;
        }
        .reader-date {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
            margin-bottom: 20px;
        }
        .reader-text {
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 4px 0;
        }
        .reader-media {
            margin-top: 20px;
        }
        .reader-media img,
        .reader-media video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 12px;
            display: block;
        }

        /* 高亮批注样式 */
        .annotated {
            background-color: #fff3cd;
            border-radius: 3px;
            padding: 1px 2px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 2px solid #ffb347;
        }
        .annotated:hover {
            background-color: #ffe69c;
        }

        /* 右侧批注面板 */
        .reader-annotation-panel {
            width: 320px;
            background: #fafbfc;
            border-left: 1px solid #eaeef2;
            padding: 24px 18px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .annotation-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .annotation-item {
            background: #fff;
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid #ffb347;
        }
        .annotation-item .original {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 6px;
            padding-left: 4px;
            border-left: 2px solid #eee;
            padding-left: 10px;
        }
        .annotation-item .note-text {
            font-size: 15px;
            color: #1e2a3a;
            font-weight: 500;
            line-height: 1.5;
            padding-top: 4px;
        }
        .annotation-empty {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            margin-top: 40px;
        }

        /* 添加批注按钮（浮动） */
        .add-annotation-btn {
            position: sticky;
            bottom: 20px;
            left: 100%;
            transform: translateX(-120%);
            background: #111;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            transition: background 0.2s;
            z-index: 10;
            white-space: nowrap;
        }
        .add-annotation-btn:hover {
            background: #2d2d2d;
        }
        .add-annotation-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* 阅读页删除按钮（底部） */
        .reader-delete {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
        }
        .reader-delete button {
            background: #fff;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .reader-delete button:hover {
            background: #e74c3c;
            color: #fff;
        }

        /* ===== 空状态 ===== */
        .empty {
            text-align: center;
            color: #bbb;
            padding: 60px 20px;
            font-size: 16px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 800px) {
            .reader {
                flex-direction: column;
            }
            .reader-annotation-panel {
                width: 100%;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid #eaeef2;
                padding: 16px;
            }
            .reader-main {
                padding: 20px 18px 30px;
            }
            .add-annotation-btn {
                position: fixed;
                bottom: 20px;
                right: 20px;
                transform: none;
                left: auto;
            }
        }

        @media (max-width: 600px) {
            .header {
                height: 220px;
            }
            .profile {
                margin-top: -56px;
            }
            .avatar {
                width: 88px;
                height: 88px;
            }
            .name {
                font-size: 17px;
            }
            .reader-title {
                font-size: 22px;
            }
            .post {
                padding: 12px 14px;
                flex-wrap: wrap;
            }
            .post-left {
                flex: 1 1 100%;
                margin-bottom: 6px;
            }
            .post-actions {
                margin-left: 0;
                justify-content: flex-end;
                width: 100%;
            }
            .fab {
                right: 16px;
                bottom: 16px;
                width: 50px;
                height: 50px;
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="header"></div>

    <div class="profile">
        <img src="images/avatar.jpg" class="avatar" alt="avatar">
        <div class="name">安宁</div>
    </div>

    <div class="toolbar">
        <input placeholder="搜索文章..." oninput="search(this.value)">
    </div>

    <div class="container" id="list"></div>

    <button class="fab" onclick="openEditor()">＋</button>

    <!-- ================= 编辑器 ================= -->
    <div class="editor" id="editor">

        <div class="editor-top">
            <button class="exit" onclick="closeEditor()">×</button>
            <button class="publish-btn" onclick="publish()">发布</button>
        </div>

        <input id="title" placeholder="标题">
        <input id="bio" placeholder="简介">

        <textarea id="content" placeholder="正文内容..."></textarea>

        <div class="upload">
            <input type="file" multiple accept="image/*,video/*" onchange="handleFiles(event)">
        </div>

    </div>

    <!-- ================= 阅读页（含批注面板） ================= -->
    <div class="reader" id="reader">

        <div class="reader-main" id="readerMain">
            <button class="reader-exit" onclick="closeReader()">×</button>
            <div class="reader-title" id="rTitle"></div>
            <div class="reader-date" id="rDate"></div>
            <div class="reader-text" id="rText"></div>
            <div class="reader-media" id="rMedia"></div>

            <div class="reader-delete">
                <button onclick="deleteCurrentPost()">🗑 删除这篇文章</button>
            </div>

            <!-- 浮动添加批注按钮 -->
            <button class="add-annotation-btn" id="addAnnoBtn" onclick="addAnnotation()">✏️ 添加批注</button>
        </div>

        <!-- 右侧批注面板 -->
        <div class="reader-annotation-panel" id="annotationPanel">
            <div class="annotation-panel-title">📌 批注列表</div>
            <div id="annotationList"></div>
        </div>

    </div>

    <script>
        // ============================================================
        //  1. 数据加载  +  兼容旧数据（增加 annotations 字段）
        // ============================================================
        let posts = JSON.parse(localStorage.getItem("posts")) || [];

        posts = posts.map(p => {
            if (!p.id) {
                p.id = Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            }
            if (!p.annotations) {
                p.annotations = []; // 批注数组
            }
            return p;
        });
        localStorage.setItem("posts", JSON.stringify(posts));

        let currentId = null;          // 当前阅读的文章 id
        let uploaded = [];
        let currentAnnotations = [];   // 当前文章的批注（引用）
        let selectedRange = null;     // 用户选中的范围（用于添加批注）

        // ============================================================
        //  2. 发布（增加 annotations 字段）
        // ============================================================
        function publish() {
            const titleVal = document.getElementById("title").value.trim();
            const bioVal = document.getElementById("bio").value.trim();
            const contentVal = document.getElementById("content").value.trim();

            if (!titleVal) {
                alert("请填写标题");
                return;
            }

            const newPost = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                title: titleVal,
                bio: bioVal || "暂无简介",
                content: contentVal || "（空内容）",
                media: [...uploaded],
                date: new Date().toISOString().slice(0, 10),
                annotations: []
            };

            posts.unshift(newPost);
            localStorage.setItem("posts", JSON.stringify(posts));

            // 清空编辑器
            document.getElementById("title").value = "";
            document.getElementById("bio").value = "";
            document.getElementById("content").value = "";
            uploaded = [];
            document.querySelector(".upload input[type=file]").value = "";

            closeEditor();
            render();
        }

        // ============================================================
        //  3. 文件上传
        // ============================================================
        function handleFiles(e) {
            const files = [...e.target.files];
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                if (file.type.startsWith("image")) {
                    uploaded.push({ type: "img", url });
                } else if (file.type.startsWith("video")) {
                    uploaded.push({ type: "video", url });
                }
            });
        }

        // ============================================================
        //  4. 渲染列表（批注按钮变色，去掉批注文本显示）
        // ============================================================
        function render(list) {
            const el = document.getElementById("list");
            const data = list || posts;

            if (data.length === 0) {
                el.innerHTML = `<div class="empty">📭 还没有文章，点击右下角「＋」发布</div>`;
                return;
            }

            el.innerHTML = "";
            data.forEach(p => {
                const div = document.createElement("div");
                div.className = "post";

                const left = document.createElement("div");
                left.className = "post-left";

                const titleDiv = document.createElement("h3");
                titleDiv.textContent = p.title;
                left.appendChild(titleDiv);

                const dateSpan = document.createElement("div");
                dateSpan.className = "date";
                dateSpan.textContent = p.date;
                left.appendChild(dateSpan);

                div.appendChild(left);

                const actions = document.createElement("div");
                actions.className = "post-actions";

                // 批注按钮（根据是否有批注变色）
                const noteBtn = document.createElement("button");
                noteBtn.className = "post-note-btn";
                if (p.annotations && p.annotations.length > 0) {
                    noteBtn.classList.add("has-note");
                }
                noteBtn.innerHTML = "✏️";
                noteBtn.setAttribute("aria-label", "批注");
                noteBtn.onclick = function(e) {
                    e.stopPropagation();
                    // 直接打开文章并滚动到批注面板
                    openPost(p.id);
                    // 延迟滚动到面板
                    setTimeout(() => {
                        const panel = document.getElementById("annotationPanel");
                        if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 300);
                };
                actions.appendChild(noteBtn);

                // 删除按钮
                const delBtn = document.createElement("button");
                delBtn.className = "post-delete";
                delBtn.innerHTML = "✕";
                delBtn.setAttribute("aria-label", "删除文章");
                delBtn.onclick = function(e) {
                    e.stopPropagation();
                    deletePost(p.id);
                };
                actions.appendChild(delBtn);

                div.appendChild(actions);

                div.onclick = function() {
                    openPost(p.id);
                };

                el.appendChild(div);
            });
        }

        // ============================================================
        //  5. 打开文章（渲染高亮批注）
        // ============================================================
        function openPost(id) {
            const p = posts.find(item => item.id === id);
            if (!p) {
                alert("文章不存在或已被删除");
                return;
            }

            currentId = id;
            currentAnnotations = p.annotations || [];

            // 清空旧事件监听
            const main = document.getElementById("readerMain");
            // 渲染标题（带高亮）
            const titleEl = document.getElementById("rTitle");
            titleEl.innerHTML = applyHighlights(p.title, currentAnnotations, 'title');

            document.getElementById("rDate").textContent = p.date;

            // 渲染正文（带高亮）
            const textEl = document.getElementById("rText");
            textEl.innerHTML = applyHighlights(p.content, currentAnnotations, 'content');

            // 媒体
            const mediaEl = document.getElementById("rMedia");
            mediaEl.innerHTML = "";
            if (p.media && p.media.length > 0) {
                p.media.forEach(m => {
                    if (m.type === "img") {
                        const img = document.createElement("img");
                        img.src = m.url;
                        img.alt = "图片";
                        mediaEl.appendChild(img);
                    } else if (m.type === "video") {
                        const video = document.createElement("video");
                        video.src = m.url;
                        video.controls = true;
                        video.style.maxWidth = "100%";
                        video.style.borderRadius = "10px";
                        video.style.marginTop = "12px";
                        mediaEl.appendChild(video);
                    }
                });
            }

            // 渲染批注面板
            renderAnnotationPanel(currentAnnotations);

            // 显示阅读页
            document.getElementById("reader").style.display = "flex";
            document.body.style.overflow = "hidden";

            // 绑定选择事件
            document.addEventListener('selectionchange', handleSelection);
            // 清除之前的选中
            selectedRange = null;
            updateAddButtonState();
        }

        // ============================================================
        //  6. 高亮渲染辅助（根据批注位置）
        // ============================================================
        function applyHighlights(text, annotations, targetType) {
            if (!text) return text;
            // 过滤出属于该 targetType 的批注
            const anns = annotations.filter(a => a.target === targetType);
            if (anns.length === 0) return text;

            // 按起始偏移量降序排列，以便从后往前插入标签避免偏移
            const sorted = [...anns].sort((a, b) => b.startOffset - a.startOffset);

            let result = text;
            for (const ann of sorted) {
                const start = ann.startOffset;
                const end = ann.endOffset;
                if (start < 0 || end > result.length || start >= end) continue;
                // 切割
                const before = result.substring(0, start);
                const highlighted = result.substring(start, end);
                const after = result.substring(end);
                // 用 span 包裹
                const span = `<span class="annotated" data-anno-id="${ann.id}" data-target="${targetType}">${highlighted}</span>`;
                result = before + span + after;
            }
            return result;
        }

        // ============================================================
        //  7. 批注面板渲染
        // ============================================================
        function renderAnnotationPanel(annotations) {
            const container = document.getElementById("annotationList");
            if (!annotations || annotations.length === 0) {
                container.innerHTML = `<div class="annotation-empty">暂无批注<br>选中文字后点击「添加批注」</div>`;
                return;
            }
            let html = '';
            annotations.forEach(a => {
                html += `
                    <div class="annotation-item" data-id="${a.id}">
                        <div class="original">「${escapeHtml(a.selectedText)}」</div>
                        <div class="note-text">${escapeHtml(a.note)}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        //  8. 选择处理 + 添加批注
        // ============================================================
        function handleSelection() {
            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed) {
                selectedRange = null;
                updateAddButtonState();
                return;
            }
            const range = sel.getRangeAt(0);
            // 检查是否在阅读区域内
            const main = document.getElementById("readerMain");
            if (!main.contains(range.commonAncestorContainer)) {
                selectedRange = null;
                updateAddButtonState();
                return;
            }
            // 确保选中文本不跨元素（简单处理）
            selectedRange = range;
            updateAddButtonState();
        }

        function updateAddButtonState() {
            const btn = document.getElementById("addAnnoBtn");
            if (selectedRange && !selectedRange.collapsed) {
                btn.disabled = false;
                btn.textContent = '✏️ 添加批注';
            } else {
                btn.disabled = true;
                btn.textContent = '✏️ 选择文字';
            }
        }

        function addAnnotation() {
            if (!selectedRange || selectedRange.collapsed) {
                alert('请先在文章中选择一段文字（标题或正文）');
                return;
            }

            const sel = window.getSelection();
            const text = sel.toString().trim();
            if (!text) {
                alert('所选内容为空');
                return;
            }

            // 判断选中文本属于标题还是正文
            const titleEl = document.getElementById("rTitle");
            const textEl = document.getElementById("rText");
            const container = selectedRange.commonAncestorContainer;
            let targetType = 'content';
            let fullText = '';
            if (titleEl.contains(container)) {
                targetType = 'title';
                fullText = titleEl.textContent; // 原始文本（不含标签）
            } else if (textEl.contains(container)) {
                targetType = 'content';
                fullText = textEl.textContent;
            } else {
                alert('请选择标题或正文区域的文字');
                return;
            }

            // 计算偏移量：在纯文本中查找选中文本的位置（考虑可能有多个相同，使用 indexOf 但不精确，但作为演示）
            // 为了准确，我们利用 range 的 startOffset 和 endOffset，但需要考虑文本节点偏移。
            // 简化：直接利用 range 的 startContainer 和 offset，但比较复杂。
            // 我们采用更可靠的方法：根据所选文本在 fullText 中的位置（利用 indexOf），但可能不唯一。
            // 为了演示，我们使用 indexOf，并假设唯一。但更好的做法是存储节点路径，但为了代码简洁，我们采用 indexOf + 向后查找。
            // 这里我们使用 range 的 startOffset 和 endOffset 相对于其文本节点，但如果在多个文本节点中，需要累加。
            // 为了演示简便，我们用全文搜索第一个匹配（可能存在歧义）。
            // 更稳健的做法：在全文里查找选中文本，从后往前找多个匹配？但太复杂。
            // 我们选择使用 range 的 startContainer 和 offset，但我们知道 range 是选中的范围，可以直接获取 startOffset/endOffset 相对于 startContainer。
            // 如果 startContainer 是文本节点，那么 offset 就是在该文本节点中的偏移。
            // 如果跨多个文本节点，则需拼接。但我们可以取 range 的 commonAncestorContainer，但文本可能跨节点。
            // 为了简单，我们只处理单个文本节点的情况（即选中的文本在同一个文本节点内）。大多数情况下是。
            let startOffset, endOffset;
            const startNode = selectedRange.startContainer;
            const endNode = selectedRange.endContainer;
            if (startNode.nodeType === 3 && endNode.nodeType === 3 && startNode === endNode) {
                // 同一文本节点
                startOffset = selectedRange.startOffset;
                endOffset = selectedRange.endOffset;
            } else {
                // 跨节点，使用全文搜索（不精确）
                const fullTextClean = fullText;
                const idx = fullTextClean.indexOf(text);
                if (idx === -1) {
                    alert('无法定位所选文本，请重试');
                    return;
                }
                startOffset = idx;
                endOffset = idx + text.length;
            }

            // 检查是否已有批注覆盖该位置（去重）
            const existing = currentAnnotations.find(a => a.target === targetType && a.startOffset === startOffset && a.endOffset === endOffset);
            if (existing) {
                alert('该文本已有批注，请编辑或删除旧批注');
                return;
            }

            const note = prompt('请输入批注内容：');
            if (note === null || note.trim() === '') {
                return; // 取消或空
            }

            const newAnno = {
                id: 'anno_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                target: targetType,
                startOffset: startOffset,
                endOffset: endOffset,
                selectedText: text,
                note: note.trim()
            };

            // 更新数据
            const post = posts.find(p => p.id === currentId);
            if (!post) {
                alert('文章不存在');
                return;
            }
            if (!post.annotations) post.annotations = [];
            post.annotations.push(newAnno);
            localStorage.setItem("posts", JSON.stringify(posts));

            // 重新渲染文章
            openPost(currentId); // 刷新

            // 清除选择
            window.getSelection().removeAllRanges();
            selectedRange = null;
            updateAddButtonState();
        }

        // ============================================================
        //  9. 删除批注（通过点击批注项删除？我们增加删除功能）
        // 可以在批注面板的每个项加个删除按钮，但用户未明确要求，先忽略。
        // 但可以增加：双击批注项删除，或者加个小叉。
        // 为了完善，我们在批注项上添加删除按钮。
        // 在渲染时添加删除按钮，并绑定事件。
        // 修改 renderAnnotationPanel
        // ============================================================
        // 我们重新定义 renderAnnotationPanel 以包含删除按钮
        // 但为了不重新加载全部，我们覆盖原函数
        const originalRender = renderAnnotationPanel;
        renderAnnotationPanel = function(annotations) {
            const container = document.getElementById("annotationList");
            if (!annotations || annotations.length === 0) {
                container.innerHTML = `<div class="annotation-empty">暂无批注<br>选中文字后点击「添加批注」</div>`;
                return;
            }
            let html = '';
            annotations.forEach(a => {
                html += `
                    <div class="annotation-item" data-id="${a.id}">
                        <div class="original">「${escapeHtml(a.selectedText)}」</div>
                        <div class="note-text">${escapeHtml(a.note)}</div>
                        <button style="margin-top:8px;background:none;border:1px solid #ddd;border-radius:4px;padding:2px 10px;cursor:pointer;font-size:12px;color:#888;" onclick="deleteAnnotation('${a.id}')">删除</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        // 删除批注
        function deleteAnnotation(annoId) {
            if (!confirm('确定删除这条批注吗？')) return;
            const post = posts.find(p => p.id === currentId);
            if (!post) return;
            const idx = post.annotations.findIndex(a => a.id === annoId);
            if (idx !== -1) {
                post.annotations.splice(idx, 1);
                localStorage.setItem("posts", JSON.stringify(posts));
                openPost(currentId); // 刷新
            }
        }

        // ============================================================
        //  10. 删除文章
        // ============================================================
        function deletePost(id) {
            if (!confirm("确定要删除这篇文章吗？删除后无法恢复。")) {
                return;
            }
            const index = posts.findIndex(p => p.id === id);
            if (index === -1) {
                alert("文章不存在");
                return;
            }
            posts.splice(index, 1);
            localStorage.setItem("posts", JSON.stringify(posts));

            if (currentId === id) {
                closeReader();
                currentId = null;
            }
            render();
        }

        function deleteCurrentPost() {
            if (!currentId) {
                alert("没有正在阅读的文章");
                return;
            }
            deletePost(currentId);
        }

        // ============================================================
        //  11. 搜索
        // ============================================================
        function search(keyword) {
            const k = keyword.trim().toLowerCase();
            if (!k) {
                render(posts);
                return;
            }
            const filtered = posts.filter(p =>
                p.title.toLowerCase().includes(k) ||
                p.content.toLowerCase().includes(k) ||
                (p.bio && p.bio.toLowerCase().includes(k)) ||
                (p.annotations && p.annotations.some(a => a.note.toLowerCase().includes(k) || a.selectedText.toLowerCase().includes(k)))
            );
            render(filtered);
        }

        // ============================================================
        //  12. 控制
        // ============================================================
        function openEditor() {
            document.getElementById("editor").style.display = "flex";
            document.body.style.overflow = "hidden";
        }

        function closeEditor() {
            document.getElementById("editor").style.display = "none";
            document.body.style.overflow = "";
        }

        function closeReader() {
            document.getElementById("reader").style.display = "none";
            document.body.style.overflow = "";
            document.removeEventListener('selectionchange', handleSelection);
            currentId = null;
            selectedRange = null;
        }

        // ============================================================
        //  13. 键盘快捷键
        // ============================================================
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                if (document.getElementById("reader").style.display === "flex") {
                    closeReader();
                } else if (document.getElementById("editor").style.display === "flex") {
                    closeEditor();
                }
            }
        });

        // ============================================================
        //  14. 初始化
        // ============================================================
        render();

        // 额外：在阅读页点击高亮文本时，在右侧面板滚动到对应批注（可选）
        // 通过事件委托监听点击高亮文本
        document.addEventListener('click', function(e) {
            const target = e.target.closest('.annotated');
            if (target && document.getElementById("reader").style.display === "flex") {
                const annoId = target.dataset.annoId;
                if (annoId) {
                    // 在面板中高亮对应的批注项
                    const items = document.querySelectorAll('.annotation-item');
                    items.forEach(item => {
                        item.style.background = '#fff';
                        item.style.borderLeftColor = '#ffb347';
                        if (item.dataset.id === annoId) {
                            item.style.background = '#fef9e7';
                            item.style.borderLeftColor = '#f39c12';
                            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    });
                }
            }
        });
    </script>

</body>
